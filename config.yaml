# ============================================================
#  财经信息监控系统 - 配置文件
#  日常修改建议用「启动管理页面.bat」，本文件由程序自动维护
# ============================================================

# ---------- 监控名单 ----------
# handle = X 用户名（不带@），note = 备注（会显示在推送里）
accounts:
  - handle: "DeItaone"
    note: "Walter Bloomberg 快讯"
  - handle: "WatcherGuru"
    note: "Watcher.Guru 快讯"
  - handle: "elonmusk"
    note: "马斯克"

# ---------- 数据源 ----------
# provider 可选值：
#   mock          - 本地测试数据（不联网，用于调试流程）
#   rsshub        - 免费！自建 RSSHub（需在 Secrets 配置 RSSHUB_BASE 和 TWITTER_AUTH_TOKEN）
#   twitterapi_io - 按量付费接口（约$2-5/月，免费方案失效时切换到这里）
provider: x_graphql

rsshub_base: ""          # 例: https://你的域名 ，留空则读环境变量 RSSHUB_BASE
twitterapi_io_key: ""    # 留空则读环境变量 TWITTERAPI_IO_KEY

# ---------- 推送通道 ----------
# wecom    = 企业微信群机器人（推荐，无第三方中转）
# pushplus = 微信公众号/PushPlus（备用）
push_channel: wecom

wecom_webhook: ""   # 留空则读环境变量 WECOM_WEBHOOK（云端走 GitHub Secrets）

# ---------- 关键词粗筛 ----------
# 推文里【命中任意一个】才进入下一轮 AI 精筛（英文不区分大小写）
keywords:
  - "降息"
  - "加息"
  - "关税"
  - "制裁"
  - "ETF"
  - "美联储"
  - "SEC"
  - "BTC"

# 含以下词的直接跳过（噪音过滤）
exclude_keywords:
  - "抽奖"
  - "giveaway"

# ---------- AI 精筛 ----------
ai_enabled: true
gemini_model: gemini-2.5-flash   # 免费额度模型；备用 gemini-2.0-flash
min_score: 6                      # 影响评分 1-10，≥此值才推送；AI不可用时照推（标注未评级）

# ---------- 推送 ----------
max_push_per_run: 30              # 单次运行最多推送条数（防止刷屏/超免费额度）
